name: Bug report
description: Report a reproducible defect in the bridge, OAuth flow, or tooling.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Provide a deterministic path to reproduce.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - local
        - preview
        - production
        - GitHub Actions
        - Supabase
        - Vercel
        - other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - blocker
        - high
        - medium
        - low
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste stack traces, console output, request IDs, or attach screenshots. Do not paste secrets.
      render: shell

  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Who is affected and how often does it happen?
      placeholder: Every login attempt fails for all users in production.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched for existing issues before submitting this report.
          required: true
        - label: I removed or redacted secrets from logs and screenshots.
          required: true
